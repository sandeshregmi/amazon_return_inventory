<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  #wrap {
    box-sizing: border-box;
    padding: 4px;
  }
  #reader {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
  }
  #status {
    margin-top: 8px;
    font-size: 14px;
    color: #444;
    text-align: center;
    min-height: 20px;
  }
  #status.error {
    color: #b00020;
  }
  #torch-btn {
    display: none;
    margin: 8px auto 0 auto;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    background: #F8FAFC;
    color: #0F172A;
    cursor: pointer;
  }
  #torch-btn.on {
    background: #FEF3C7;
    border-color: #F59E0B;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="reader"></div>
  <div id="status">Starting camera…</div>
  <button id="torch-btn">💡 Turn on flashlight</button>
  <div style="text-align:center; margin-top:6px; font-size:12px; color:#94A3B8;">
    Trouble scanning a curved or shiny label? Hold it flatter to the camera,
    move a little closer, and try angling away from glare.
  </div>
</div>

<script>
// ---- Minimal Streamlit bidirectional component protocol (no build step needed) ----
function sendMessageToStreamlitClient(type, data) {
  var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function notifyHost() {
  sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
}
function setFrameHeight(height) {
  sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
}
function sendValue(value) {
  sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
}
notifyHost();
setFrameHeight(380);

// ---- Barcode scanning ----
const statusEl = document.getElementById("status");
const torchBtn = document.getElementById("torch-btn");
let html5QrCode;
let stopped = false;
let torchOn = false;

function showError(msg) {
  statusEl.textContent = msg;
  statusEl.classList.add("error");
}

function onScanSuccess(decodedText) {
  if (stopped) return;
  stopped = true;
  statusEl.classList.remove("error");
  statusEl.textContent = "Scanned: " + decodedText;
  sendValue(decodedText);
  if (html5QrCode) {
    html5QrCode.stop().catch(function () {});
  }
}

function onScanFailure() {
  // Called continuously while no code is in frame — intentionally ignored.
}

async function setupTorchButton() {
  // Flashlight helps a lot with glare on shiny/curved packaging. Only show
  // the button if this device/browser actually supports it — fails silently
  // and just stays hidden otherwise.
  try {
    const capabilities = html5QrCode.getRunningTrackCapabilities();
    if (capabilities && capabilities.torch) {
      torchBtn.style.display = "inline-block";
      torchBtn.onclick = async function () {
        torchOn = !torchOn;
        try {
          await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
          torchBtn.classList.toggle("on", torchOn);
          torchBtn.textContent = torchOn ? "💡 Turn off flashlight" : "💡 Turn on flashlight";
        } catch (e) {
          torchOn = !torchOn; // revert on failure
        }
      };
    }
  } catch (e) {
    // Torch control not supported here — leave the button hidden.
  }
}

try {
  html5QrCode = new Html5Qrcode("reader");
  const config = {
    fps: 12,
    qrbox: { width: 280, height: 160 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ],
    // Use the browser/OS's native barcode detector when available (Chrome on
    // Android especially) — meaningfully more accurate than the pure-JS
    // decoder on tricky real-world labels. Falls back automatically when
    // unsupported (e.g. Safari).
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }
  };
  html5QrCode
    .start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
    .then(function () {
      statusEl.textContent = "Point the camera at the barcode…";
      setupTorchButton();
    })
    .catch(function (err) {
      showError(
        "Couldn't start the camera (" + err + "). If you're on a phone, " +
        "the page must be opened over HTTPS or as localhost — see the README."
      );
    });
} catch (err) {
  showError("Camera not available in this browser: " + err);
}
</script>
</body>
</html>
