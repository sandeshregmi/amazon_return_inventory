<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  #wrap {
    box-sizing: border-box;
    padding: 4px;
  }
  #reader {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
  }
  #status {
    margin-top: 8px;
    font-size: 14px;
    color: #444;
    text-align: center;
    min-height: 20px;
  }
  #status.error {
    color: #b00020;
  }
  .action-btn {
    display: block;
    margin: 10px auto 0 auto;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #start-btn {
    background: #2563EB;
    color: white;
  }
  #stop-btn {
    display: none;
    background: #F1F5F9;
    color: #0F172A;
    border: 1px solid #CBD5E1;
  }
  #torch-btn {
    display: none;
    background: #F8FAFC;
    color: #0F172A;
    border: 1px solid #CBD5E1;
  }
  #torch-btn.on {
    background: #FEF3C7;
    border-color: #F59E0B;
  }
  #tip {
    display: none;
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: #94A3B8;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="reader"></div>
  <div id="status"></div>
  <button id="start-btn" class="action-btn">📷 Start Scanning</button>
  <button id="stop-btn" class="action-btn">Stop Camera</button>
  <button id="torch-btn" class="action-btn">💡 Turn on flashlight</button>
  <div id="tip">
    Trouble scanning a curved or shiny label? Hold it flatter to the camera,
    move a little closer, and try angling away from glare.
  </div>
</div>

<script>
// ---- Minimal Streamlit bidirectional component protocol (no build step needed) ----
function sendMessageToStreamlitClient(type, data) {
  var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function notifyHost() {
  sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
}
function setFrameHeight(height) {
  sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
}
function sendValue(value) {
  sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
}
notifyHost();

// ---- Elements ----
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start-btn");
const stopBtn = document.getElementById("stop-btn");
const torchBtn = document.getElementById("torch-btn");
const tipEl = document.getElementById("tip");

let html5QrCode = null;
let scanning = false;
let stopped = false;
let torchOn = false;

// Start idle: camera is OFF until the user explicitly taps Start, entirely
// within this component — this never depends on Streamlit's session
// surviving the moment the browser's camera-permission prompt appears,
// which is what was causing the "camera flashes on then vanishes" bug.
setFrameHeight(90);

function showError(msg) {
  statusEl.textContent = msg;
  statusEl.classList.add("error");
}

function resetToIdle() {
  scanning = false;
  startBtn.style.display = "block";
  stopBtn.style.display = "none";
  torchBtn.style.display = "none";
  tipEl.style.display = "none";
  statusEl.textContent = "";
  statusEl.classList.remove("error");
  setFrameHeight(90);
}

function onScanSuccess(decodedText) {
  if (stopped) return;
  stopped = true;
  statusEl.classList.remove("error");
  statusEl.textContent = "Scanned: " + decodedText;
  sendValue(decodedText);
  if (html5QrCode) {
    html5QrCode.stop().catch(function () {});
  }
}

function onScanFailure() {
  // Called continuously while no code is in frame — intentionally ignored.
}

async function setupTorchButton() {
  try {
    const capabilities = html5QrCode.getRunningTrackCapabilities();
    if (capabilities && capabilities.torch) {
      torchBtn.style.display = "block";
    }
  } catch (e) {
    // Torch control not supported here — leave the button hidden.
  }
}

torchBtn.onclick = async function () {
  torchOn = !torchOn;
  try {
    await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.classList.toggle("on", torchOn);
    torchBtn.textContent = torchOn ? "💡 Turn off flashlight" : "💡 Turn on flashlight";
  } catch (e) {
    torchOn = !torchOn; // revert on failure
  }
};

function attemptStart(cameraConstraint, config, onFallback) {
  return html5QrCode
    .start(cameraConstraint, config, onScanSuccess, onScanFailure)
    .then(function () {
      scanning = true;
      statusEl.textContent = "Point the camera at the barcode…";
      stopBtn.style.display = "block";
      tipEl.style.display = "block";
      setupTorchButton();
    })
    .catch(function (err) {
      if (onFallback) {
        return onFallback(err);
      }
      showError(
        "Couldn't start the camera (" + err + "). If you're on a phone, " +
        "the page must be opened over HTTPS or as localhost — see the README."
      );
      startBtn.style.display = "block";
      setFrameHeight(140);
    });
}

startBtn.onclick = function () {
  stopped = false;
  startBtn.style.display = "none";
  statusEl.textContent = "Starting camera…";
  setFrameHeight(420);

  try {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }
    const config = {
      fps: 12,
      qrbox: { width: 280, height: 160 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      // Use the browser/OS's native barcode detector when available (Chrome
      // on Android especially) — meaningfully more accurate than the
      // pure-JS decoder on tricky real-world labels. Falls back
      // automatically when unsupported (e.g. Safari).
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // Strictly require the rear-facing camera first (some phones otherwise
    // default to the front/selfie camera despite a soft "environment"
    // hint). If a device genuinely has no separate rear camera to satisfy
    // that exact match, fall back to the softer hint, then finally to
    // whatever camera the device actually has (found via enumeration —
    // html5-qrcode requires either a camera ID string or an object with
    // exactly one key, so an empty {} isn't valid here).
    attemptStart({ facingMode: { exact: "environment" } }, config, function () {
      return attemptStart({ facingMode: "environment" }, config, function () {
        return Html5Qrcode.getCameras()
          .then(function (cameras) {
            if (!cameras || !cameras.length) {
              throw new Error("No cameras found on this device");
            }
            // On phones with more than one camera, the rear camera is very
            // often the last one listed — a reasonable last-resort guess
            // when facingMode itself isn't working on this device.
            const cameraId = cameras[cameras.length - 1].id;
            return attemptStart(cameraId, config, null);
          })
          .catch(function (err) {
            showError(
              "Couldn't start the camera (" + err + "). If you're on a phone, " +
              "the page must be opened over HTTPS or as localhost — see the README."
            );
            startBtn.style.display = "block";
            setFrameHeight(140);
          });
      });
    });
  } catch (err) {
    showError("Camera not available in this browser: " + err);
    startBtn.style.display = "block";
    setFrameHeight(140);
  }
};

stopBtn.onclick = function () {
  if (html5QrCode && scanning) {
    html5QrCode.stop().catch(function () {});
  }
  resetToIdle();
};
</script>
</body>
</html>
