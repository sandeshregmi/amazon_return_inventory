<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  #wrap {
    box-sizing: border-box;
    padding: 4px;
  }
  video, #preview {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 8px;
    display: none;
    background: #000;
  }
  #status {
    margin-top: 8px;
    font-size: 13px;
    color: #444;
    text-align: center;
    min-height: 18px;
  }
  #status.error {
    color: #b00020;
  }
  .action-btn {
    display: none;
    margin: 8px auto 0 auto;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #start-btn {
    display: block;
    background: #2563EB;
    color: white;
  }
  #capture-btn {
    background: #2563EB;
    color: white;
  }
  #retake-btn {
    background: #F1F5F9;
    color: #0F172A;
    border: 1px solid #CBD5E1;
  }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="preview" />
  <div id="status"></div>
  <button id="start-btn" class="action-btn">📷 Take Photo</button>
  <button id="capture-btn" class="action-btn">📸 Capture</button>
  <button id="retake-btn" class="action-btn">↺ Retake</button>
</div>

<script>
// ---- Minimal Streamlit bidirectional component protocol (no build step needed) ----
function sendMessageToStreamlitClient(type, data) {
  var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function notifyHost() {
  sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
}
function setFrameHeight(height) {
  sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
}
function sendValue(value) {
  sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
}
notifyHost();
setFrameHeight(90);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start-btn");
const captureBtn = document.getElementById("capture-btn");
const retakeBtn = document.getElementById("retake-btn");

let stream = null;

function showError(msg) {
  statusEl.textContent = msg;
  statusEl.classList.add("error");
}

function stopStream() {
  if (stream) {
    stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }
}

async function tryGetUserMedia(facingConstraint) {
  const constraints = {
    video: Object.assign(
      { width: { ideal: 1920 }, height: { ideal: 1080 } },
      facingConstraint ? { facingMode: facingConstraint } : {}
    ),
    audio: false
  };
  return navigator.mediaDevices.getUserMedia(constraints);
}

startBtn.onclick = async function () {
  startBtn.style.display = "none";
  statusEl.classList.remove("error");
  statusEl.textContent = "Starting camera…";
  setFrameHeight(420);

  try {
    // Strictly require the rear camera first; fall back progressively for
    // devices that can't satisfy that exactly.
    try {
      stream = await tryGetUserMedia({ exact: "environment" });
    } catch (e1) {
      try {
        stream = await tryGetUserMedia("environment");
      } catch (e2) {
        stream = await tryGetUserMedia(null);
      }
    }
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();
    captureBtn.style.display = "block";
    statusEl.textContent = "Line up the shot, then tap Capture";
  } catch (err) {
    showError("Couldn't start the camera: " + err);
    startBtn.style.display = "block";
    setFrameHeight(140);
  }
};

captureBtn.onclick = function () {
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(video, 0, 0, w, h);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

  preview.src = dataUrl;
  preview.style.display = "block";
  video.style.display = "none";
  captureBtn.style.display = "none";
  retakeBtn.style.display = "block";
  statusEl.textContent = "Photo captured";
  sendValue(dataUrl);
};

retakeBtn.onclick = function () {
  preview.style.display = "none";
  retakeBtn.style.display = "none";
  video.style.display = "block";
  captureBtn.style.display = "block";
  statusEl.textContent = "Line up the shot, then tap Capture";
  sendValue(null);
};
</script>
</body>
</html>
